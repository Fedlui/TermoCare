<rect x="990" y="352" width="160" height="80" rx="12" fill="#fff" stroke="#d9e0e8"/><text x="1002" y="370" font-size="10.5" fill="#5b6b7f" font-weight="600">DASHBOARD · ENFERMERÍA</text>
<circle cx="1008" cy="382" r="4" fill="#d62839"/><text x="1018" y="386" font-size="11" fill="#0b2545">Paciente 1</text><text x="1140" y="386" font-size="11" fill="#d62839" text-anchor="end" font-weight="700">38.3 °C</text>
<circle cx="1008" cy="398" r="4" fill="#2a9d8f"/><text x="1018" y="402" font-size="11" fill="#0b2545">Paciente 2</text><text x="1140" y="402" font-size="11" fill="#2a9d8f" text-anchor="end" font-weight="700">36.8 °C</text>
<circle cx="1008" cy="414" r="4" fill="#2a9d8f"/><text x="1018" y="418" font-size="11" fill="#0b2545">Paciente 3</text><text x="1140" y="418" font-size="11" fill="#2a9d8f" text-anchor="end" font-weight="700">37.0 °C</text>
<text x="605" y="440" font-size="12" fill="#5b6b7f">Lectura cada pocos segundos · alerta en menos de un minuto</text>
</g>
<rect x="40" y="492" width="1125" height="118" rx="14" fill="#0b2545"/>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2380;0.2500;1.0000" dur="16s" repeatCount="indefinite"/><text x="80" y="566" font-size="54" font-weight="800" fill="#ef6c35">1</text><text x="140" y="535" font-size="20" font-weight="700" fill="#ffffff">Emite</text><text x="140" y="562" font-size="15" fill="#cfd8e3">Un calentador diminuto en el parche prende y apaga en ciclos.</text><text x="140" y="586" font-size="15" fill="#cfd8e3">Manda una onda de calor muy suave hacia el interior de la piel.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2380;0.2500;0.4880;0.5000;1.0000" dur="16s" repeatCount="indefinite"/><text x="80" y="566" font-size="54" font-weight="800" fill="#ef6c35">2</text><text x="140" y="535" font-size="20" font-weight="700" fill="#ffffff">Escucha</text><text x="140" y="562" font-size="15" fill="#cfd8e3">Dos termistores reciben la onda: T1 a 4 mm y T2 a 8 mm del emisor.</text><text x="140" y="586" font-size="15" fill="#cfd8e3">Mientras más lejos, la onda llega más débil y más tarde.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4880;0.5000;0.7380;0.7500;1.0000" dur="16s" repeatCount="indefinite"/><text x="80" y="566" font-size="54" font-weight="800" fill="#ef6c35">3</text><text x="140" y="535" font-size="20" font-weight="700" fill="#ffffff">Calcula</text><text x="140" y="562" font-size="15" fill="#cfd8e3">La atenuación (A2/A1) y el retraso dicen cuánta grasa hay y cuánto calor sube del núcleo.</text><text x="140" y="586" font-size="15" fill="#cfd8e3">Con eso se corrige la piel:  T núcleo = 35.2 + 0.28 × (35.2 − 24.0) = 38.3 °C</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7380;0.7500;1.0000" dur="16s" repeatCount="indefinite"/><text x="80" y="566" font-size="54" font-weight="800" fill="#ef6c35">4</text><text x="140" y="535" font-size="20" font-weight="700" fill="#ffffff">Avisa</text><text x="140" y="562" font-size="15" fill="#cfd8e3">La lectura viaja por WiFi a la nube, donde se guarda y se revisa.</text><text x="140" y="586" font-size="15" fill="#cfd8e3">Si hay fiebre, la familia recibe un Telegram y enfermería la ve en su pantalla.</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff6b35" stop-opacity="0.8"/><stop offset="1" stop-color="#ff6b35" stop-opacity="0"/></radialGradient>
    <clipPath id="skin"><rect x="40" y="150" width="440" height="300"/></clipPath>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9aa5b1"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#0f1b2d"/>

  <!-- títulos de escena -->
  <g font-size="13" letter-spacing="2" fill="#7f93a8">
    <text x="40" y="40">1 · EMITIR Y ESCUCHAR</text>
    <text x="520" y="40">2 · LEER LA ONDA</text>
    <text x="880" y="40">3 · AVISAR</text>
  </g>
  <text x="40" y="70" font-size="20" fill="#ffffff" font-weight="700">El parche manda calor a la piel y escucha cómo regresa</text>

  <!-- ESCENA 1: corte de piel -->
  <g clip-path="url(#skin)">
    <rect x="40" y="150" width="440" height="40" fill="#f4d3c0"/>
    <rect x="40" y="190" width="440" height="90" fill="#f7e3a3"/>
    <rect x="40" y="280" width="440" height="170" fill="#e8a49c"/>
    <!-- ondas -->
    <g fill="none" stroke="#ff6b35" stroke-width="3">
      <circle cx="150" cy="150" r="10">
        <animate attributeName="r" values="10;300" dur="2s" begin="0s;w1.end+4s" id="w1" fill="freeze"/>
        <animate attributeName="opacity" values="1;0" dur="2s" begin="0s;w1.end+4s" fill="freeze"/>
      </circle>
      <circle cx="150" cy="150" r="10" opacity="0">
        <animate attributeName="r" values="10;300" dur="2s" begin="0.7s;w2.end+4s" id="w2" fill="freeze"/>
        <animate attributeName="opacity" values="1;0" dur="2s" begin="0.7s;w2.end+4s" fill="freeze"/>
      </circle>
      <circle cx="150" cy="150" r="10" opacity="0">
        <animate attributeName="r" values="10;300" dur="2s" begin="1.4s;w3.end+4s" id="w3" fill="freeze"/>
        <animate attributeName="opacity" values="1;0" dur="2s" begin="1.4s;w3.end+4s" fill="freeze"/>
      </circle>
    </g>
  </g>
  <g font-size="12" fill="#5c3b2e">
    <text x="472" y="176" text-anchor="end">piel</text><text x="472" y="240" text-anchor="end">grasa</text><text x="472" y="400" text-anchor="end">músculo · núcleo</text>
  </g>
  <!-- núcleo latiendo -->
  <rect x="40" y="420" width="440" height="30" fill="#c1121f" opacity="0.35">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="260" y="440" font-size="12" fill="#ffffff" text-anchor="middle">calor del núcleo</text>
  <!-- parche -->
  <rect x="90" y="120" width="300" height="30" rx="10" fill="#f1faee" stroke="#457b9d" stroke-width="2"/>
  <circle cx="150" cy="135" r="34" fill="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.4;0.45;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="135" y="128" width="30" height="14" rx="3" fill="#ff6b35">
    <animate attributeName="fill" values="#7a3a20;#ff6b35;#ff6b35;#7a3a20;#7a3a20" keyTimes="0;0.05;0.4;0.45;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="240" cy="135" r="8" fill="#e63946">
    <animate attributeName="r" values="8;13;8" dur="6s" begin="0.5s" keyTimes="0;0.1;0.3" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="135" r="8" fill="#f4a261">
    <animate attributeName="r" values="8;10;8" dur="6s" begin="1.2s" keyTimes="0;0.1;0.3" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
  </circle>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="150" y="108" fill="#ff8c5a">emisor</text>
    <text x="240" y="108" fill="#ff6b6b">T1 · 4 mm</text>
    <text x="330" y="108" fill="#f4a261">T2 · 8 mm</text>
  </g>
  <text x="40" y="482" font-size="13" fill="#cdd6e0">El emisor prende y apaga. T1 recibe la onda fuerte; T2, débil y tarde.</text>

  <!-- ESCENA 2: gráfica -->
  <g transform="translate(520,120)">
    <rect width="320" height="280" rx="12" fill="#162a44"/>
    <line x1="20" y1="240" x2="300" y2="240" stroke="#3b5068"/>
    <path d="M20 200 L60 200 L60 60 L130 60 L130 200 L200 200 L200 60 L270 60 L270 200 L300 200" fill="none" stroke="#ff6b35" stroke-width="2" stroke-dasharray="5 4" opacity="0.7"/>
    <path id="c1" d="M20 160 C40 160 60 80 95 80 S145 160 165 160 S200 80 235 80 S285 160 300 150" fill="none" stroke="#e63946" stroke-width="3" stroke-dasharray="420" stroke-dashoffset="420">
      <animate attributeName="stroke-dashoffset" values="420;0;0" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M20 205 C50 205 75 165 115 165 S170 205 190 205 S225 165 260 165 S295 200 300 202" fill="none" stroke="#f4a261" stroke-width="3" stroke-dasharray="380" stroke-dashoffset="380">
      <animate attributeName="stroke-dashoffset" values="380;380;0;0" keyTimes="0;0.15;0.75;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <g font-size="12">
      <text x="20" y="30" fill="#ff6b6b" font-weight="700">T1</text>
      <text x="50" y="30" fill="#f4a261" font-weight="700">T2</text>
      <text x="80" y="30" fill="#ff8c5a">emisor</text>
      <text x="160" y="268" fill="#9aa5b1" text-anchor="middle">menos fuerza + más retraso = más grasa</text>
    </g>
  </g>
  <rect x="505" y="420" width="350" height="54" rx="10" fill="#1d3557" stroke="#457b9d"/>
  <text x="680" y="443" font-size="13" fill="#a8dadc" text-anchor="middle" font-family="Courier New, monospace">T_núcleo = T_piel + K·(T_piel − T_cuarto)</text>
  <text x="680" y="463" font-size="12" fill="#7f93a8" text-anchor="middle">K sale de la onda</text>

  <!-- ESCENA 3: nube y avisos -->
  <path d="M850 260 C900 200 930 200 960 200" fill="none" stroke="#3b5068" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <g>
    <ellipse cx="1010" cy="190" rx="60" ry="34" fill="#dbeaf5"/>
    <circle cx="985" cy="172" r="26" fill="#dbeaf5"/><circle cx="1030" cy="168" r="30" fill="#dbeaf5"/>
    <text x="1010" y="194" font-size="14" fill="#1d3557" text-anchor="middle" font-weight="700">Nube</text>
    <text x="1010" y="211" font-size="11" fill="#457b9d" text-anchor="middle">API + MySQL</text>
  </g>
  <circle r="6" fill="#a8dadc">
    <animateMotion path="M850 260 C900 200 930 200 960 200" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M1010 230 L1010 280" stroke="#3b5068" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <!-- teléfono -->
  <rect x="955" y="290" width="110" height="190" rx="16" fill="#e5e9ef"/>
  <rect x="965" y="306" width="90" height="150" rx="6" fill="#ffffff"/>
  <circle cx="1010" cy="352" r="30" fill="#2a9d8f">
    <animate attributeName="fill" values="#2a9d8f;#2a9d8f;#e9c46a;#e9c46a;#c1121f;#c1121f" keyTimes="0;0.3;0.35;0.6;0.65;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="1010" y="357" opacity="1">36.9<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.33;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="1010" y="357" opacity="0">37.7<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.62;0.63;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="1010" y="357" opacity="0">38.4<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.64;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <g font-size="11" text-anchor="middle" font-weight="700">
    <text x="1010" y="402" fill="#2a9d8f">NORMAL<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.33;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="1010" y="402" fill="#b8860b" opacity="0">PRECAUCIÓN<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.62;0.63;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="1010" y="402" fill="#c1121f" opacity="0">FIEBRE<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.64;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <text x="1010" y="440" font-size="10" fill="#5c6b7a" text-anchor="middle">°C núcleo</text>
  <!-- burbuja de mensaje -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.7;1" dur="12s" repeatCount="indefinite"/>
    <rect x="890" y="250" width="160" height="34" rx="10" fill="#c1121f"/>
    <text x="970" y="272" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Telegram: fiebre 38.4 °C</text>
  </g>
  <text x="880" y="500" font-size="13" fill="#cdd6e0">Enfermería y familia reciben el aviso al momento.</text>
  <!-- flecha parche -> nube -->
  <path d="M390 135 C600 90 760 260 850 260" fill="none" stroke="#3b5068" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <circle r="5" fill="#ff6b35">
    <animateMotion path="M390 135 C600 90 760 260 850 260" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>

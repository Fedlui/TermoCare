<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0b2545" flood-opacity="0.08"/></filter></defs>
  <rect width="1200" height="520" fill="#f6f8fb"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
</g><rect x="40" y="90" width="265" height="185" rx="14" fill="#fff" filter="url(#sh)"/><circle cx="84" cy="136" r="26" fill="#fdeee6"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(84,136)"><path d="M0 -14 V6" stroke="#ef6c35" stroke-width="3"/><circle cx="0" cy="10" r="6" stroke="#ef6c35" stroke-width="3"/><path d="M8 -12 C12 -8 12 -2 8 2" stroke="#0b2545" stroke-width="2"/><path d="M13 -16 C19 -9 19 1 13 6" stroke="#0b2545" stroke-width="2"/></g><text x="64" y="198" font-size="17" font-weight="700" fill="#0b2545">Núcleo, no solo piel</text><text x="64" y="226" font-size="13" fill="#5b6b7f">Corrige la piel con una onda</text><text x="64" y="246" font-size="13" fill="#5b6b7f">de calor y el aire del cuarto.</text><g>
</g><rect x="325" y="90" width="265" height="185" rx="14" fill="#fff" filter="url(#sh)"/><circle cx="369" cy="136" r="26" fill="#fdeee6"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(369,136)"><circle r="15" stroke="#ef6c35" stroke-width="3"/><path d="M0 -8 V0 L6 5" stroke="#0b2545" stroke-width="3"/></g><text x="349" y="198" font-size="17" font-weight="700" fill="#0b2545">Vigilancia 24 horas</text><text x="349" y="226" font-size="13" fill="#5b6b7f">Una lectura cada 10 segundos,</text><text x="349" y="246" font-size="13" fill="#5b6b7f">sin que el paciente se mida.</text><g>
</g><rect x="610" y="90" width="265" height="185" rx="14" fill="#fff" filter="url(#sh)"/><circle cx="654" cy="136" r="26" fill="#fdeee6"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(654,136)"><path d="M-11 6 V-2 C-11 -9 -6 -14 0 -14 S11 -9 11 -2 V6 L14 10 H-14 Z" stroke="#ef6c35" stroke-width="3"/><path d="M-4 14 C-3 17 3 17 4 14" stroke="#0b2545" stroke-width="3"/></g><text x="634" y="198" font-size="17" font-weight="700" fill="#0b2545">Alertas al momento</text><text x="634" y="226" font-size="13" fill="#5b6b7f">Telegram a familia y médico,</text><text x="634" y="246" font-size="13" fill="#5b6b7f">y aviso en el dashboard.</text><g>
</g><rect x="895" y="90" width="265" height="185" rx="14" fill="#fff" filter="url(#sh)"/><circle cx="939" cy="136" r="26" fill="#fdeee6"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(939,136)"><rect x="-14" y="-8" width="28" height="16" rx="5" stroke="#ef6c35" stroke-width="3"/><path d="M-6 0 L-1 5 L8 -5" stroke="#0b2545" stroke-width="3"/></g><text x="919" y="198" font-size="17" font-weight="700" fill="#0b2545">Sin falsas alarmas</text><text x="919" y="226" font-size="13" fill="#5b6b7f">Si el parche se despega, pide</text><text x="919" y="246" font-size="13" fill="#5b6b7f">revisarlo en vez de alertar.</text><g>
</g><rect x="40" y="295" width="265" height="185" rx="14" fill="#fff" filter="url(#sh)"/><circle cx="84" cy="341" r="26" fill="#fdeee6"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(84,341)"><path d="M0 14 C-18 2 -16 -14 -6 -14 C-3 -14 -1 -12 0 -10 C1 -12 3 -14 6 -14 C16 -14 18 2 0 14 Z" stroke="#ef6c35" stroke-width="3"/><path d="M-9 -1 H-4 L-2 -6 L2 4 L4 -1 H9" stroke="#0b2545" stroke-width="2"/></g><text x="64" y="403" font-size="17" font-weight="700" fill="#0b2545">Seguro con marcapasos</text><text x="64" y="431" font-size="13" fill="#5b6b7f">No usa el ritmo cardíaco y se</text><text x="64" y="451" font-size="13" fill="#5b6b7f">coloca lejos del implante.</text><g>
</g><rect x="325" y="295" width="265" height="185" rx="14" fill="#fff" filter="url(#sh)"/><circle cx="369" cy="341" r="26" fill="#fdeee6"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(369,341)"><rect x="-14" y="-7" width="28" height="14" rx="7" stroke="#ef6c35" stroke-width="3" transform="rotate(-35)"/><path d="M-4 -6 L4 6" stroke="#0b2545" stroke-width="3" transform="rotate(-35)"/></g><text x="349" y="403" font-size="17" font-weight="700" fill="#0b2545">Medicamentos a la vista</text><text x="349" y="431" font-size="13" fill="#5b6b7f">Registra paracetamol y</text><text x="349" y="451" font-size="13" fill="#5b6b7f">esteroides, que ocultan fiebre.</text><g>
</g><rect x="610" y="295" width="265" height="185" rx="14" fill="#fff" filter="url(#sh)"/><circle cx="654" cy="341" r="26" fill="#fdeee6"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(654,341)"><path d="M-15 12 H15" stroke="#0b2545" stroke-width="2.5"/><path d="M-13 6 L-5 -2 L1 3 L13 -10" stroke="#ef6c35" stroke-width="3"/></g><text x="634" y="403" font-size="17" font-weight="700" fill="#0b2545">Historial de 24 horas</text><text x="634" y="431" font-size="13" fill="#5b6b7f">Piel, núcleo y cuarto con</text><text x="634" y="451" font-size="13" fill="#5b6b7f">alertas y medicinas marcadas.</text><g>
</g><rect x="895" y="295" width="265" height="185" rx="14" fill="#fff" filter="url(#sh)"/><circle cx="939" cy="341" r="26" fill="#fdeee6"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(939,341)"><path d="M-14 10 L-4 0 L2 5 L14 -8" stroke="#ef6c35" stroke-width="3"/><path d="M6 -8 H14 V0" stroke="#0b2545" stroke-width="3"/></g><text x="919" y="403" font-size="17" font-weight="700" fill="#0b2545">Alerta temprana</text><text x="919" y="431" font-size="13" fill="#5b6b7f">Predice la fiebre por tendencia</text><text x="919" y="451" font-size="13" fill="#5b6b7f">a 1 y 2 horas (en desarrollo).</text><g></g>
<text x="40" y="52" font-size="26" font-weight="700" fill="#0b2545">Qué hace ThermoCare</text>
<text x="40" y="76" font-size="15" fill="#5b6b7f">Todo lo que el sistema hace por el paciente, la familia y el equipo médico.</text>
</svg>

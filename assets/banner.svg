<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2545"/><stop offset="1" stop-color="#13315c"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eec1a2"/><stop offset="1" stop-color="#d9997a"/></linearGradient>
    <radialGradient id="heat"><stop offset="0" stop-color="#ef6c35" stop-opacity="0.55"/><stop offset="1" stop-color="#ef6c35" stop-opacity="0"/></radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef6c35" stop-opacity="0.35"/><stop offset="1" stop-color="#ef6c35" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1200" height="440" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200"/>
    <path d="M100 0 V440 M200 0 V440 M300 0 V440 M400 0 V440 M500 0 V440 M600 0 V440 M700 0 V440 M800 0 V440 M900 0 V440 M1000 0 V440 M1100 0 V440"/>
  </g>
  <!-- marca -->
  <g transform="translate(70,78)">
    <rect width="44" height="44" rx="12" fill="#ef6c35"/>
    <path d="M10 26 C14 26 15 16 19 16 S24 30 28 30 S32 20 34 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="58" y="30" font-size="15" fill="#a8c5e6" letter-spacing="3" font-weight="600">THERMOCARE IOT</text>
  </g>
  <text x="70" y="182" fill="#ffffff" font-size="44" font-weight="800">La fiebre, detectada</text>
  <text x="70" y="234" fill="#ffffff" font-size="44" font-weight="800">antes de que sea tarde.</text>
  <text x="72" y="278" fill="#c7d6e8" font-size="17">Parche de antebrazo que vigila la temperatura del núcleo del</text>
  <text x="72" y="302" fill="#c7d6e8" font-size="17">cuerpo de pacientes en quimioterapia, las 24 horas.</text>
  <g font-size="13" font-weight="600">
    <rect x="70" y="332" width="182" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="161" y="353" fill="#fff" text-anchor="middle">Temperatura del núcleo</text>
    <rect x="262" y="332" width="168" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="346" y="353" fill="#fff" text-anchor="middle">Alertas al momento</text>
    <rect x="440" y="332" width="190" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="535" y="353" fill="#fff" text-anchor="middle">Pensado para marcapasos</text>
  </g>
  <!-- antebrazo -->
  <path d="M700 440 C740 360 820 330 900 320 C1000 308 1120 300 1200 296 L1200 440 Z" fill="url(#arm)"/>
  <circle cx="930" cy="330" r="70" fill="url(#heat)">
    <animate attributeName="r" values="55;80;55" dur="3s" repeatCount="indefinite"/>
  </circle>
  <rect x="880" y="310" width="110" height="38" rx="12" fill="#f8fafc" stroke="#0b2545" stroke-opacity="0.25" transform="rotate(-4 935 329)"/>
  <g transform="rotate(-4 935 329)">
    <rect x="896" y="323" width="16" height="12" rx="3" fill="#ef6c35"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></rect>
    <circle cx="934" cy="329" r="6" fill="#d62839"/><circle cx="962" cy="329" r="6" fill="#f4a261"/>
  </g>
  <path d="M935 305 C935 270 960 250 990 238" fill="none" stroke="#a8c5e6" stroke-width="1.5" stroke-dasharray="4 5"/>
  <circle r="4" fill="#ef6c35"><animateMotion path="M935 305 C935 270 960 250 990 238" dur="2s" repeatCount="indefinite"/></circle>
  <!-- tarjeta de lectura -->
  <g filter="url(#sh)">
    <rect x="860" y="56" width="290" height="190" rx="18" fill="#ffffff"/>
  </g>
  <text x="884" y="88" font-size="12" fill="#5b6b7f" font-weight="600" letter-spacing="1.2">PACIENTE · CAMA 12</text>
  <rect x="1046" y="74" width="84" height="22" rx="11" fill="#e3f4f1"/><circle cx="1060" cy="85" r="4" fill="#2a9d8f"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="1096" y="89" font-size="11.5" fill="#2a9d8f" font-weight="700" text-anchor="middle">EN VIVO</text>
  <text x="884" y="140" font-size="44" font-weight="800" fill="#0b2545">37.0<tspan font-size="22" fill="#5b6b7f" font-weight="600"> °C</tspan></text>
  <text x="884" y="162" font-size="13" fill="#5b6b7f">Temperatura del núcleo · Normal</text>
  <path d="M884 228 L884 214 C904 214 914 206 934 208 S974 200 994 202 S1034 196 1054 194 S1104 190 1126 186 L1126 228 Z" fill="url(#area)"/>
  <path d="M884 214 C904 214 914 206 934 208 S974 200 994 202 S1034 196 1054 194 S1104 190 1126 186" fill="none" stroke="#ef6c35" stroke-width="2.5" stroke-dasharray="260" stroke-dashoffset="260">
    <animate attributeName="stroke-dashoffset" values="260;0;0" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <line x1="884" y1="182" x2="1126" y2="182" stroke="#d62839" stroke-dasharray="3 4" stroke-opacity="0.6"/><text x="1126" y="177" font-size="10.5" fill="#d62839" text-anchor="end">38.0 °C</text>
  <text x="884" y="240" font-size="10.5" fill="#94a3b8">últimas 24 h</text>
</svg>
